# CI build check for the SSMTS web portal.
# Runs lint and the production build (tsc + vite) on every push and pull request.
name: Build Web

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:5000/api/v1

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: ssmts-web-dist
          path: dist
          retention-days: 7
